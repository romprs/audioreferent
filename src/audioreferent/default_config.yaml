# Настройки голосового помощника audioreferent.
# Пользовательский файл (~/.config/audioreferent/config.yaml) переопределяет
# отдельные ключи поверх этого файла — не обязательно копировать всё целиком.

# Активационное слово. Сравнение нечёткое (допускаются небольшие ошибки
# распознавания), поэтому можно использовать обычные слова русского языка.
wake_word: "вика"

# Максимально допустимое расстояние Левенштейна между произнесённым словом
# и wake_word, при котором активация всё ещё считается сработавшей.
wake_word_fuzzy_threshold: 1

# null = устройство ввода по умолчанию (см. `audioreferent list-devices`)
input_device: null

# null = используется переменная окружения VOSK_MODEL_PATH либо путь
# /usr/share/vosk-model-small-ru
model_path: null

sample_rate: 16000

# Голосовая биометрия (необязательно): проверка, что активационное слово
# произнёс тот же человек, что записал образец(ы) голоса через
# `audioreferent settings` (вкладка "Голос") — фильтр "чей голос", а не
# средство от фонового шума как такового. Пока образцов нет или
# voice_lock_enabled: false, ничего не меняется — как будто функции нет.
# null = модель ищется по умолчанию в
# ~/.local/share/vosk/vosk-model-spk-0.4
spk_model_path: null
voice_lock_enabled: false
# Косинусное сходство x-векторов, начиная с которого голос считается
# "своим". Выше — строже (легче отклонить свой же голос в шуме), ниже —
# мягче (легче пропустить чужой).
voice_lock_threshold: 0.5

# Сколько секунд после активационного слова ждать команду
command_timeout_seconds: 6

# Скорость отклика распознавания. recognition_end_silence_seconds — пауза
# тишины после речи, после которой фраза считается законченной. Действует
# двумя путями: помощник грузит модель через оверлей с правленым
# conf/model.conf (правило 2 = это значение, правило 3 — вдвое, правило 4
# — вчетверо больше; у модели по умолчанию 0.5 / 1.0 / 2.0) и сам
# завершает фразу, когда после речи уровень сигнала с микрофона держится
# ниже vad_silence_rms дольше этой паузы. null — паузы модели как есть.
# Меньше — быстрее ответ, но пауза посреди фразы разорвёт её.
# vad_silence_rms — порог тишины (RMS PCM16, 0..32767); если помощник
# режет фразы на ходу — поднимите паузу, если в шумной комнате никогда не
# завершает сам — поднимите порог (уровень пишется в журнал при -v).
# recognition_endpointing (short/default/long) — режим детектора Vosk
# через API, действует только в версиях, где он есть. audio_block_samples
# — размер блока с микрофона: 4000 сэмплов = 0,25 с.
recognition_endpointing: short
recognition_end_silence_seconds: 0.4
vad_silence_rms: 300
audio_block_samples: 4000

# Режим заполнения формы встречи ("вика создай встречу" -> окно redmail,
# дальше поля по одному без активационного слова): сколько секунд тишины
# (без фраз-полей) держать режим. По истечении режим выключается, окно
# остаётся открытым — вернуться в него можно фразой-полем (пока окно
# открыто, помощник сам поймёт) или командой "продолжи настраивать встречу".
form_timeout_seconds: 120

# Слова режима заполнения формы встречи. Первое слово фразы выбирает поле,
# остальное — значение: "тема планёрка", "дата следующий понедельник",
# "время восемь тридцать", "продолжительность два часа", "повторение каждую
# неделю", "участники шилкин пономарёв", "место кабинет сто двадцать один",
# "описание утренняя планёрка". Отдельные слова "сохранить"/"отменить"
# нажимают кнопки окна. Правятся в GUI (таблица «Форма встречи»).
event_form:
  fields:
    subject: ["тема", "название"]
    date: ["дата", "число"]
    time: ["время", "начало"]
    duration: ["продолжительность", "длительность"]
    recurrence: ["повторение", "повторять", "повтор"]
    participants: ["участники", "участник", "участников", "участника", "пригласить", "пригласи", "добавь", "добавить"]
    calendar: ["календарь", "календаре", "календаря"]
    location: ["место"]
    description: ["описание"]
  save: ["сохранить", "сохрани"]
  cancel: ["отменить", "отмени", "отмена"]
  # Разговорный режим после «создай встречу»: помощник спрашивает по очереди
  # тему, день, время, длительность, календарь, участников и место; ответ —
  # просто значение, без слова-поля. Переход к следующему вопросу — по слову
  # из next, к предыдущему — из back. Слова-поля работают и в этом режиме.
  next: ["дальше", "далее", "следующий", "следующее", "пропусти", "пропустить"]
  back: ["назад", "вернись", "предыдущий"]

feedback:
  # Короткий звуковой сигнал при активации/распознавании команды
  sound: true
  # Голосовой ответ (движок — см. tts_engine ниже)
  speech: false

# Чем озвучивать ответы при feedback.speech: true.
#   piper      — синтез Piper TTS (офлайн, один голос, любой текст, ~0,1 с
#                на фразу; нужны программа piper и файлы голоса — RPM кладёт
#                их в /opt/audioreferent/piper/ и /usr/share/audioreferent/piper/).
#   recordings — только заранее записанные фразы из voice/*.mp3; для текста
#                без записи звучит общее «Не удалось выполнить команду».
# Если Piper выбран, но недоступен (нет программы/голоса), помощник сам
# переходит на записи, а причина пишется в журнал.
tts_engine: piper
# null = искать piper в /opt/audioreferent/piper/piper, ~/.local/share/audioreferent/piper/piper, PATH
piper_binary_path: null
# null = искать голоса в /usr/share/audioreferent/piper и ~/.local/share/audioreferent/piper
piper_voices_dir: null
# Голоса (файл <имя>.onnx + <имя>.onnx.json): ru_RU-irina-medium — женский,
# голос RHVoice (лаборатория Tiflo RHVoice подтвердила 12.09.2026, что
# дополнительного разрешения не требуется); ru_RU-denis-medium и
# ru_RU-dmitri-medium — мужские, CC0.
piper_voice: ru_RU-irina-medium

commands:
  - phrases: ["открой браузер", "запусти браузер"]
    action: launch_app
    args:
      default_browser: true
      candidates: ["firefox", "chromium", "chromium-browser", "google-chrome-stable", "google-chrome"]

  - phrases: ["открой терминал", "запусти терминал"]
    action: launch_app
    args:
      candidates: ["mate-terminal", "konsole", "gnome-terminal", "xfce4-terminal", "lxterminal", "xterm"]

  - phrases: ["открой файловый менеджер", "открой проводник", "открой файлы"]
    action: launch_app
    args: {app: "xdg-open", target: "~"}

  - phrases: ["запусти яндекс браузер", "открой яндекс браузер"]
    action: launch_app
    args:
      candidates: ["yandex-browser-stable", "yandex-browser"]

  - phrases: ["сверни текущее окно", "сверни окно"]
    action: minimize_window
    args: {}

  - phrases: ["закрой текущее окно", "закрой окно"]
    action: close_window
    args: {}

  - phrases: ["сверни все окна"]
    action: minimize_all
    args: {}

  - phrases: ["сохрани документ", "сохрани файл"]
    action: send_keys
    args: {keys: "ctrl+s"}

  - phrases: ["создай текстовый документ", "создай документ"]
    action: launch_app
    args:
      candidates: ["r7-office-desktopeditors --new:word"]

  - phrases: ["создай табличный документ", "создай таблицу"]
    action: launch_app
    args:
      candidates: ["r7-office-desktopeditors --new:cell"]

  - phrases: ["создай презентацию"]
    action: launch_app
    args:
      candidates: ["r7-office-desktopeditors --new:slide"]

  # Всё, что сказано после фразы, считается адресом сайта:
  # "вика открой сайт яндекс" -> алиас из sites, либо буквальный домен
  # ("точка" распознаётся как "."), либо, если ничего не подошло —
  # обычный поиск по этому запросу (см. search_web).
  - phrases: ["открой сайт", "перейди на сайт"]
    action: open_url
    args:
      sites:
        яндекс: "ya.ru"
        гугл: "google.com"
        почта: "mail.ru"
        вконтакте: "vk.com"
        ютуб: "youtube.com"

  - phrases: ["сделай громче", "увеличь громкость", "громче"]
    action: volume_change
    args: {delta: 10}

  - phrases: ["сделай тише", "уменьши громкость", "тише"]
    action: volume_change
    args: {delta: -10}

  - phrases: ["выключи звук", "заглуши звук", "без звука"]
    action: volume_mute
    args: {mute: true}

  - phrases: ["включи звук"]
    action: volume_mute
    args: {mute: false}

  - phrases: ["заблокируй экран", "заблокируй компьютер"]
    action: lock_screen
    args: {}

  # Всё, что сказано после фразы, становится поисковым запросом:
  # "вика найди погоду в москве" -> ищет "погоду в москве".
  - phrases: ["найди", "найди в интернете", "поищи"]
    action: search_web
    args: {}

  # Команды почтового клиента redmail — через его локальный канал
  # управления (см. redmail_client.py); работают только пока redmail
  # запущен на этой же машине. Ничего из них не отправляет письмо/
  # приглашение само — redmail лишь открывает диалог с подтверждением,
  # кнопку "Отправить"/"Сохранить"/"Да" всё равно жмёт человек.
  # Если redmail не запущен — запускает его (candidates, как у launch_app);
  # остальные redmail-команды при закрытой почте тоже запускают её и просят
  # повторить команду, когда окно появится.
  # Фразы даны и в повелительном наклонении, и в инфинитиве ("создать
  # встречу") — второе распознаватель нередко выдаёт вместо первого.
  - phrases: ["открой почту", "открыть почту", "запусти почту", "запустить почту", "открой редмейл", "запусти редмейл", "открой redmail"]
    action: redmail_focus
    args:
      candidates: ["redmail"]

  # "вика создай встречу [планёрка] [на 15 сентября] [в восемь тридцать]"
  # -> в redmail открывается окно новой встречи, названное из первой фразы
  # уже заполнено, и помощник переходит в режим заполнения: дальше БЕЗ
  # активационного слова по одной фразе — "тема планёрка", "дата
  # пятнадцатое сентября" / "следующий понедельник", "время восемь
  # тридцать", "продолжительность два часа", "повторение каждую неделю",
  # "участники шилкин пономарёв" (по фамилии из адресной книги), "место
  # кабинет сто двадцать один", "описание ...", и в конце "сохранить" или
  # "отменить". Все изменения видны в окне; режим выключается по
  # form_timeout_seconds тишины (окно остаётся).
  - phrases: ["создай встречу", "создать встречу", "создай событие", "создать событие", "запланируй встречу", "запланировать встречу"]
    action: redmail_event_form
    args: {}

  # Разговор правки СВОЕЙ встречи: "вика измени встречу [планёрка] [завтра]".
  # Не названо — помощник спросит, какую; нашлось несколько — «Найдено 3: …
  # Выберите номер»; повторяющаяся — «Только этот день или всю серию?».
  # Затем открывается окно встречи и те же вопросы по полям, что при
  # создании; «дальше» оставляет поле как есть.
  - phrases: ["измени встречу", "изменить встречу", "измени событие", "изменить событие", "отредактируй встречу", "измени мероприятие"]
    action: redmail_event_form
    args: {edit: true}

  # Вернуться в режим заполнения, если окно встречи ещё открыто, а режим
  # погас по таймауту (например, пока переключались между окнами).
  - phrases: ["продолжи настраивать встречу", "продолжить настраивать встречу", "продолжи заполнение", "продолжи встречу"]
    action: redmail_event_form_resume
    args: {}

  # "вика перенеси встречу совещание на десятое сентября в пятнадцать
  # тридцать" -> ищет встречу с темой "совещание" (старая дата не названа
  # -> ищем сегодня), переносит на 10 сентября 15:30. Слово "на" перед
  # новой датой/временем обязательно — по нему команда отличает "куда
  # переносим" от темы и старой даты/времени.
  - phrases: ["перенеси встречу", "перенеси событие", "перенеси мероприятие"]
    action: redmail_reschedule_event
    args: {}

  # Разговор отмены: "вика отмени встречу [совещание] [завтра]" — какую
  # встречу, номер (если несколько), «этот день или серию» для повторяющейся,
  # «Отменить встречу …?» -> «да». Участников уведомляет почта, окон не открывает.
  - phrases: ["отмени встречу", "отмени событие", "отмени мероприятие"]
    action: redmail_cancel_event
    args: {}
